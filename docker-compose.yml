services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: energy-forecast-backend
    ports:
      - "8000:8000"
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: energy-forecast-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
